<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" role="img" aria-label="The seam: the probabilistic model proposes a change, a deterministic validation gate disposes by applying the write">
  <defs>
    <linearGradient id="acc3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
    <marker id="ar3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5a6ea0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1000" height="430" rx="18" fill="#0e1730" stroke="#26325a" stroke-width="1.5"/>

  <!-- region labels -->
  <text x="250" y="52" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#8fb4ff">PROBABILISTIC</text>
  <text x="760" y="52" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#5eead4">DETERMINISTIC</text>

  <!-- the seam -->
  <line x1="500" y1="70" x2="500" y2="400" stroke="#3b4a75" stroke-width="2" stroke-dasharray="7 7"/>
  <rect x="452" y="196" width="96" height="60" rx="12" fill="#16234a" stroke="url(#acc3)" stroke-width="2.5"/>
  <text x="500" y="222" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="800" fill="#ffffff">GATE</text>
  <text x="500" y="242" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#8fb4ff">validate</text>
  <text x="500" y="118" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="1" fill="#6b7ba3">the seam</text>

  <!-- model -->
  <rect x="70" y="150" width="180" height="86" rx="14" fill="#111d3a" stroke="#33477e" stroke-width="1.5"/>
  <text x="160" y="190" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="700" fill="#e2e8f0">Model</text>
  <text x="160" y="214" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#7f92b8">confident, maybe wrong</text>

  <!-- proposal chip -->
  <rect x="300" y="162" width="120" height="62" rx="10" fill="#141f3e" stroke="#2d3f6e"/>
  <text x="360" y="190" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" fill="#dbe4f5">proposal</text>
  <text x="360" y="210" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#7f92b8">buffered</text>
  <line x1="250" y1="193" x2="298" y2="193" stroke="#5a6ea0" stroke-width="1.6" marker-end="url(#ar3)"/>
  <line x1="422" y1="205" x2="450" y2="220" stroke="#5a6ea0" stroke-width="1.6" marker-end="url(#ar3)"/>
  <text x="330" y="150" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-style="italic" fill="#8fb4ff">proposes</text>

  <!-- write / side effect -->
  <rect x="580" y="150" width="200" height="86" rx="14" fill="#0f2a26" stroke="#2f6f63" stroke-width="1.5"/>
  <text x="680" y="190" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" fill="#a7f3d0">Write</text>
  <text x="680" y="214" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#79b5a6">commit · API · deploy</text>
  <line x1="550" y1="220" x2="578" y2="200" stroke="#5a6ea0" stroke-width="1.6" marker-end="url(#ar3)"/>
  <text x="655" y="150" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-style="italic" fill="#5eead4">disposes</text>

  <text x="500" y="352" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#e8edf8">The model never holds the write token.</text>
  <text x="500" y="380" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#93a4c4">It proposes. Something deterministic disposes.</text>
</svg>
