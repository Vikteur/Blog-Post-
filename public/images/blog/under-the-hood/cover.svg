<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Under the Hood: What the Agentic SDLC Handbook taught me about working with agents">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1020"/>
      <stop offset="1" stop-color="#0e1730"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.28" r="0.6">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#2a3a63" stroke-opacity="0.18" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#3b82f6" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- kicker -->
  <text x="80" y="150" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700" letter-spacing="4" fill="#6ea8fe">THE AGENTIC SDLC HANDBOOK &#183; PART III</text>

  <!-- title -->
  <text x="78" y="272" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="104" font-weight="800" fill="#f8fafc" letter-spacing="-2">Under the</text>
  <text x="78" y="382" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="104" font-weight="800" letter-spacing="-2" fill="url(#accent)">Hood</text>

  <!-- subtitle -->
  <text x="82" y="452" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="500" fill="#93a4c4">What actually happens when you work with agents</text>

  <!-- author -->
  <rect x="82" y="520" width="14" height="14" rx="3" fill="url(#accent)"/>
  <text x="108" y="533" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="600" fill="#cbd5e1">Viktor Van Steenweghen</text>

  <!-- runtime-machine stack (the harness is the compiler) -->
  <g filter="url(#soft)" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <!-- connecting spine -->
    <line x1="1000" y1="150" x2="1000" y2="500" stroke="#33477e" stroke-width="2"/>
    <circle cx="1000" cy="150" r="5" fill="#818cf8"/>
    <circle cx="1000" cy="500" r="5" fill="#3b82f6"/>

    <!-- Client -->
    <rect x="905" y="128" width="190" height="72" rx="14" fill="#111d3a" stroke="#2d3f6e" stroke-width="1.5"/>
    <text x="1000" y="172" text-anchor="middle" font-size="26" font-weight="700" fill="#e2e8f0">Client</text>

    <!-- Harness (highlighted) -->
    <rect x="875" y="238" width="250" height="86" rx="16" fill="#16234a" stroke="url(#accent)" stroke-width="2.5"/>
    <text x="1000" y="278" text-anchor="middle" font-size="28" font-weight="800" fill="#ffffff">Harness</text>
    <text x="1000" y="305" text-anchor="middle" font-size="16" font-weight="600" fill="#8fb4ff" letter-spacing="1">= the compiler</text>

    <!-- Source code / primitives -->
    <rect x="905" y="362" width="190" height="72" rx="14" fill="#111d3a" stroke="#2d3f6e" stroke-width="1.5"/>
    <text x="1000" y="399" text-anchor="middle" font-size="24" font-weight="700" fill="#e2e8f0">Primitives</text>
    <text x="1000" y="421" text-anchor="middle" font-size="14" fill="#7f92b8">.md as code</text>

    <!-- Model -->
    <rect x="905" y="466" width="190" height="72" rx="14" fill="#111d3a" stroke="#2d3f6e" stroke-width="1.5"/>
    <text x="1000" y="510" text-anchor="middle" font-size="26" font-weight="700" fill="#e2e8f0">Model</text>
  </g>
</svg>
