<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" role="img" aria-label="Attention follows a U-curve across the context window: strong at the head and tail, weak in the middle trough">
  <defs>
    <linearGradient id="acc2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#818cf8"/><stop offset="0.5" stop-color="#3b82f6"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
    <linearGradient id="fill2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b82f6" stop-opacity="0.30"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0.02"/></linearGradient>
  </defs>
  <rect width="1000" height="500" rx="18" fill="#0e1730" stroke="#26325a" stroke-width="1.5"/>
  <text x="44" y="52" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="700" letter-spacing="3" fill="#6ea8fe">WHERE THE MODEL ACTUALLY LOOKS</text>

  <text x="44" y="112" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#93a4c4">attention</text>
  <line x1="90" y1="92" x2="90" y2="374" stroke="#33477e" stroke-width="1.5"/>
  <line x1="90" y1="374" x2="940" y2="374" stroke="#33477e" stroke-width="1.5"/>

  <line x1="370" y1="104" x2="370" y2="374" stroke="#2a3a63" stroke-width="1" stroke-dasharray="5 6"/>
  <line x1="660" y1="104" x2="660" y2="374" stroke="#2a3a63" stroke-width="1" stroke-dasharray="5 6"/>

  <path d="M120 142 C 300 152 360 332 400 342 C 470 358 530 358 600 342 C 660 328 720 152 900 142 L900 374 L120 374 Z" fill="url(#fill2)"/>
  <path d="M120 142 C 300 152 360 332 400 342 C 470 358 530 358 600 342 C 660 328 720 152 900 142" fill="none" stroke="url(#acc2)" stroke-width="4" stroke-linecap="round"/>

  <circle cx="120" cy="142" r="6" fill="#818cf8"/>
  <circle cx="500" cy="351" r="6" fill="#f87171"/>
  <circle cx="900" cy="142" r="6" fill="#818cf8"/>

  <g font-family="Inter, system-ui, sans-serif" text-anchor="middle">
    <text x="228" y="416" font-size="17" font-weight="700" fill="#cdd8ef">Head</text>
    <text x="228" y="440" font-size="13" fill="#7f92b8">system prompt, rules</text>
    <text x="515" y="416" font-size="17" font-weight="700" fill="#f2a3a3">The trough</text>
    <text x="515" y="440" font-size="13" fill="#c98a8a">where rules go to die</text>
    <text x="800" y="416" font-size="17" font-weight="700" fill="#cdd8ef">Tail</text>
    <text x="800" y="440" font-size="13" fill="#7f92b8">most recent turn</text>
  </g>
  <text x="515" y="478" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6b7ba3">position in the context window  (start  →  end)</text>
</svg>
